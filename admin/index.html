<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM Flowers — админка</title>
<style>html,body{margin:0;height:100%;background:#f5f1eb}#adminFrame{display:block;width:100%;height:100vh;border:0}</style>
</head>
<body>
<iframe id="adminFrame" src="../admin-panel.html?v=20260826-3" title="SM Flowers — админка"></iframe>
<script>
(function(){
const frame=document.getElementById('adminFrame');
const DB='https://avlozhwwvjqiypifoxox.supabase.co';
const KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
const labels={'Главная':'Главная','О студии':'О студии','Коллекции':'Выберите настроение (коллекции)','На заказ':'Ваша идея','Букеты':'Букеты недели','Философия':'Почему SM Flowers','Жизнь студии':'Жизнь студии','Финальный блок':'Финальный блок','Контакты':'Контакты','Навигация':'Навигация'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=async(url,opt={})=>{const r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})},cache:'no-store'});if(!r.ok){let msg='HTTP '+r.status;try{const x=await r.json();msg=x.message||x.hint||msg}catch{}throw new Error(msg)}return r.status===204?null:r.json()};
function media(u){return u||''}
async function installCategories(){try{const doc=frame.contentDocument;if(!doc)return;const form=doc.getElementById('productForm');if(!form)return;let select=doc.getElementById('pcollection');const cats=await json(DB+'/rest/v1/categories?select=id,name&is_active=eq.true&order=sort_order.asc,id.asc');if(!select){const label=doc.createElement('label');label.textContent='Коллекция';select=doc.createElement('select');select.id='pcollection';select.name='category_id';label.appendChild(select);const photo=doc.getElementById('pfile');(photo?.parentElement||form).before(label)}const current=select.value;select.innerHTML='<option value="">Без коллекции</option>'+(cats||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');if(current)select.value=current;if(!form.dataset.smCollectionBound){form.dataset.smCollectionBound='1';const original=form.onsubmit;form.onsubmit=async function(e){const id=doc.getElementById('pid')?.value||'';const name=doc.getElementById('pname')?.value.trim()||'';const categoryId=select.value?Number(select.value):null;await original.call(this,e);try{let targetId=id?Number(id):null;if(!targetId&&name){const found=await json(DB+'/rest/v1/products?select=id,name,created_at&name=eq.'+encodeURIComponent(name)+'&order=created_at.desc&limit=1');targetId=found?.[0]?.id||null}if(targetId)await json(DB+'/rest/v1/products?id=eq.'+encodeURIComponent(targetId),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({category_id:categoryId,updated_at:new Date().toISOString()})})}catch(err){console.error('collection save',err)}select.value=''}}}catch(e){console.error('SM collections',e)}}
function install(){try{const doc=frame.contentDocument;if(!doc)return;const st=doc.createElement('style');st.textContent='.site-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}.site-tile{pointer-events:auto!important;cursor:pointer!important}@media(max-width:800px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}}@media(max-width:520px){.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.site-tile{min-height:70px!important;padding:8px!important;font-size:11px!important}}';doc.head.appendChild(st);const grid=doc.getElementById('siteGrid');if(grid&&!grid.dataset.smEditorBound){grid.dataset.smEditorBound='1';grid.addEventListener('click',e=>{const tile=e.target.closest('.site-tile');if(!tile)return;e.preventDefault();e.stopImmediatePropagation();openBlock((tile.dataset.block||'').trim())},true)}installCategories()}catch(e){console.error('SM editor install',e)}}
async function openBlock(section){const doc=frame.contentDocument;if(!doc)return;const box=doc.getElementById('siteEditor');if(!box)return;box.classList.remove('hidden');box.innerHTML='<p class="muted">Загрузка блока…</p>';try{if(section==='Букеты'){await renderWeekly(doc,box);return}const [texts,photos]=await Promise.all([json(DB+'/rest/v1/site_content?select=*&section=eq.'+encodeURIComponent(section)+'&order=sort_order.asc,id.asc'),json(DB+'/rest/v1/site_media?select=*&section=eq.'+encodeURIComponent(section)+'&order=sort_order.asc,id.asc')]);renderGeneric(doc,box,section,texts||[],photos||[])}catch(e){box.innerHTML='<div class="notice">Не удалось загрузить блок: '+esc(e.message)+'</div>'}}
function renderGeneric(doc,box,section,texts,photos){box.innerHTML='<div class="actions"><h3>'+esc(labels[section]||section)+'</h3><button type="button" class="secondary" id="smClose">Закрыть</button></div><p class="muted">Изменения сохраняются напрямую в Supabase.</p><h4>Тексты</h4>'+(texts.length?texts.map(x=>'<div class="field"><div class="field-head"><b>'+esc(x.label||x.content_key)+'</b><span class="muted">'+esc(x.content_key)+'</span></div><textarea data-sm-text="'+esc(x.id)+'" rows="4">'+esc(x.content||'')+'</textarea><label><input type="checkbox" data-sm-vis="'+esc(x.id)+'" '+(x.is_visible!==false?'checked':'')+' style="width:auto"> Показывать</label><br><button type="button" data-sm-save-text="'+esc(x.id)+'">Сохранить</button></div>').join(''):'<p class="muted">Текстов нет.</p>')+'<h4>Фотографии</h4>'+(photos.length?photos.map(x=>'<div class="field photo"><img src="'+esc(media(x.image_url))+'" alt="'+esc(x.alt_text||'')+'"><div style="flex:1;min-width:220px"><b>'+esc(x.label||x.slot_key)+'</b><input data-sm-alt="'+esc(x.id)+'" value="'+esc(x.alt_text||'')+'" placeholder="Alt-текст"><input type="file" accept="image/*" data-sm-file="'+esc(x.id)+'"><label><input type="checkbox" data-sm-mvis="'+esc(x.id)+'" '+(x.is_visible!==false?'checked':'')+' style="width:auto"> Показывать</label><br><button type="button" data-sm-save-media="'+esc(x.id)+'">Сохранить фото</button></div></div>').join(''):'<p class="muted">Фотографий нет.</p>');doc.getElementById('smClose').onclick=()=>box.classList.add('hidden');doc.querySelectorAll('[data-sm-save-text]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.smSaveText;await json(DB+'/rest/v1/site_content?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({content:doc.querySelector('[data-sm-text="'+CSS.escape(id)+'"]').value,is_visible:doc.querySelector('[data-sm-vis="'+CSS.escape(id)+'"]').checked,updated_at:new Date().toISOString()})});b.textContent='Сохранено'}catch(e){alert(e.message)}});doc.querySelectorAll('[data-sm-save-media]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.smSaveMedia;const patch={alt_text:doc.querySelector('[data-sm-alt="'+CSS.escape(id)+'"]').value,is_visible:doc.querySelector('[data-sm-mvis="'+CSS.escape(id)+'"]').checked,updated_at:new Date().toISOString()};const f=doc.querySelector('[data-sm-file="'+CSS.escape(id)+'"]').files[0];if(f)patch.image_url=await (async()=>{const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,r=await fetch(DB+'/storage/v1/object/bouquets/'+path,{method:'POST',headers:{...H,'Content-Type':f.type},body:f});if(!r.ok)throw new Error('Ошибка загрузки фото');return DB+'/storage/v1/render/image/public/bouquets/'+path})();await json(DB+'/rest/v1/site_media?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(patch)});b.textContent='Сохранено'}catch(e){alert(e.message)}})}
async function renderWeekly(doc,box){const products=await json(DB+'/rest/v1/products?select=id,name,slug,price,description,image_url,is_active,sort_order&order=sort_order.asc,id.asc');const active=(products||[]).filter(p=>p.is_active!==false);box.innerHTML='<div class="actions"><h3>Букеты недели</h3><button type="button" class="secondary" id="smClose">Закрыть</button></div><p class="muted">Все активные букеты из каталога Supabase. Сейчас: <b>'+active.length+'</b>.</p><div class="grid">'+(active.map(p=>'<article class="card" style="margin:0;padding:14px"><img class="thumb" style="width:100%;height:180px" src="'+esc(media(p.image_url))+'" alt="'+esc(p.name)+'"><h4>'+esc(p.name)+'</h4><b>'+Number(p.price||0).toLocaleString('ru-RU')+' ₽</b><p class="muted">'+esc(p.description||'')+'</p><button type="button" data-sm-product="'+esc(p.id)+'">Редактировать букет</button></article>').join('')||'<p class="muted">Нет активных букетов.</p>')+'</div>';doc.getElementById('smClose').onclick=()=>box.classList.add('hidden');doc.querySelectorAll('[data-sm-product]').forEach(b=>b.onclick=()=>{const tab=doc.querySelector('[data-tab="products"]');if(tab)tab.click();setTimeout(()=>{const e=doc.querySelector('[data-edit="'+CSS.escape(b.dataset.smProduct)+'"]');if(e)e.click()},300)})}
frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,1000);const doc=frame.contentDocument;if(doc&&!doc.querySelector('script[data-sm-collections]')){const s=doc.createElement('script');s.src='../admin-collections.js?v=20260826-1';s.dataset.smCollections='1';doc.body.appendChild(s)}});setInterval(install,1200);
})();
</script>
</body>
</html>
