<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — Редактор сайта</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--ink:#20251f;--muted:#70786d;--paper:#f5f1eb;--card:#fff;--line:#e2dbd1;--accent:#263125}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,sans-serif}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}.back{background:#eee9e1;color:#222}.muted{color:var(--muted)}.hidden{display:none!important}.table{border:1px solid var(--line);border-radius:14px;overflow:hidden}.block{border-bottom:1px solid var(--line);margin:0}.block:last-child{border-bottom:0}.block-head{display:grid;grid-template-columns:54px minmax(180px,1fr) 170px 110px;align-items:center;gap:12px;width:100%;padding:16px 18px;border:0;border-radius:0;background:#fff;color:var(--ink);text-align:left}.block-head:hover{background:#faf8f4}.block.open .block-head{background:#f7f3ed}.num{font-family:Georgia,serif;font-style:italic;color:#858d82}.block-name{font-size:16px;font-weight:700}.block-meta{font-size:12px;color:var(--muted)}.chevron{justify-self:end;font-size:18px}.panel{display:none;padding:4px 22px 22px;background:#fff}.block.open .panel{display:block}.field{padding:18px 0;border-top:1px solid #eee8df}.field:first-child{border-top:0}.field-title{display:flex;justify-content:space-between;gap:12px;align-items:start}.key{font-size:11px;color:var(--muted)}textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8d2ca;border-radius:9px;margin:7px 0 10px;background:#fff}textarea{min-height:90px;resize:vertical}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.photo{border:1px solid var(--line);border-radius:12px;padding:12px}.preview{width:100%;height:180px;object-fit:cover;border-radius:9px;background:#eee}.photo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.save{margin-top:4px}.add{border:1px dashed #c9c1b6;background:#faf8f4;color:#30362f;width:100%;min-height:180px}.status{min-height:20px;color:var(--muted)}@media(max-width:760px){.block-head{grid-template-columns:36px 1fr 30px}.block-meta{display:none}.panel{padding:4px 14px 18px}.photo-grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><p>Вход администратора</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="msg" class="status"></p></section><section id="app" class="hidden"><section class="card"><div class="top"><div><h1>Редактор сайта</h1><div id="user" class="muted"></div></div><div class="actions"><a class="btn back" href="/admin">← В админку</a><button id="logout" class="back">Выйти</button></div></div><p class="muted">Блоки сайта показаны таблицей. Нажмите на строку — ниже раскроется всё содержимое этого блока: тексты и фотографии.</p></section><section class="card"><div id="blocks" class="table"></div></section></section></main><script>(()=>{const db=supabase.createClient(location.origin+'/supabase','sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),mediaUrl=u=>{if(!u)return'';if(String(u).startsWith('/media/')){const p=String(u).slice(7);return location.origin+'/supabase/storage/v1/object/public/bouquets/'+p}return u},sections=['Главная','Навигация','О студии','Коллекции','На заказ','Букеты','Философия','Жизнь студии','Финальный блок','Контакты','gallery','footer'];
async function ensure(){const r=await db.rpc('is_admin');if(r.error||r.data!==true)throw new Error(r.error?.message||'Нет прав администратора');return(await db.auth.getUser()).data.user}async function loadSection(name){const[t,m]=await Promise.all([db.from('site_content').select('*').eq('section',name).order('sort_order').order('id'),db.from('site_media').select('*').eq('section',name).order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;return{t:t.data||[],m:m.data||[]}}async function upload(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path='site-media/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from('bouquets').upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return'/media/'+path}function fieldHtml(x){return`<div class="field"><div class="field-title"><div><b>${esc(x.label||x.content_key)}</b><div class="key">${esc(x.content_key||'')}</div></div></div><textarea data-t="${x.id}">${esc(x.content||'')}</textarea><label><input data-v="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto;margin-right:6px"> Показывать на сайте</label><div><button class="save" data-save="${x.id}">Сохранить текст</button></div></div>`}function photoHtml(x){return`<div class="photo"><img class="preview" src="${esc(mediaUrl(x.image_url))}" alt="${esc(x.alt_text||'')}"><b>${esc(x.label||x.slot_key||'Фото')}</b><div class="key">${esc(x.slot_key||'')}</div><input data-alt="${x.id}" value="${esc(x.alt_text||'')}" placeholder="Alt-текст"><input data-file="${x.id}" type="file" accept="image/*"><label><input data-mv="${x.id}" type="checkbox" ${x.is_visible!==false?'checked':''} style="width:auto;margin-right:6px"> Показывать</label><div class="actions"><button data-msave="${x.id}">Сохранить фото</button></div></div>`}async function openBlock(el,name){if(el.classList.contains('open')){el.classList.remove('open');return}el.classList.add('open');const p=el.querySelector('.panel');p.innerHTML='<p class="muted">Загрузка…</p>';try{const d=await loadSection(name);p.innerHTML=`<h3>Тексты</h3>${d.t.length?d.t.map(fieldHtml).join(''):'<p class="muted">В этом блоке пока нет редактируемых текстов.</p>'}<h3>Фотографии</h3><div class="photo-grid">${d.m.map(photoHtml).join('')}<div class="photo"><button class="add" data-add="1">＋ Добавить фотографию</button></div></div><p class="status" data-status></p>`;p.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.save,r=await db.from('site_content').update({content:p.querySelector(`[data-t="${id}"]`).value,is_visible:p.querySelector(`[data-v="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;b.textContent='Сохранено ✓';setTimeout(()=>b.textContent='Сохранить текст',1200)}catch(e){alert(e.message)}});p.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.msave,f=p.querySelector(`[data-file="${id}"]`).files[0],patch={alt_text:p.querySelector(`[data-alt="${id}"]`).value,is_visible:p.querySelector(`[data-mv="${id}"]`).checked,updated_at:new Date().toISOString()};if(f)patch.image_url=await upload(f);const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;b.textContent='Сохранено ✓';setTimeout(()=>b.textContent='Сохранить фото',1200)}catch(e){alert(e.message)}});p.querySelector('[data-add]').onclick=async()=>{const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=async()=>{try{const f=input.files[0];if(!f)return;const url=await upload(f),slot='photo_'+Date.now(),r=await db.from('site_media').insert({section:name,slot_key:slot,image_url:url,alt_text:'',is_visible:true,sort_order:(d.m.length?Math.max(...d.m.map(x=>Number(x.sort_order)||0))+1:1),label:'Новое фото'});if(r.error)throw r.error;await openBlock(el,name);el.classList.add('open')}catch(e){alert(e.message)}};input.click()}}catch(e){p.innerHTML='<p>Ошибка: '+esc(e.message)+'</p>'}}async function render(){const root=$('blocks');root.innerHTML='';for(let i=0;i<sections.length;i++){const name=sections[i],el=document.createElement('div');el.className='block';el.innerHTML=`<button class="block-head" type="button"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="block-name">${esc(name==='gallery'?'Галерея':name==='footer'?'Подвал':name)}</span><span class="block-meta">Нажмите, чтобы открыть</span><span class="chevron">＋</span></button><div class="panel"></div>`;root.appendChild(el);el.querySelector('.block-head').onclick=()=>openBlock(el,name);}}async function init(){try{const s=await db.auth.getSession();if(s.data.session){const u=await ensure();$('user').textContent=u.email||'';$('login').style.display='none';$('app').classList.remove('hidden');await render()}}catch(e){}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const u=await ensure();$('user').textContent=u.email||'';$('login').style.display='none';$('app').classList.remove('hidden');await render()}catch(e){$('msg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.href='/admin'};init()})();</script></body></html>
