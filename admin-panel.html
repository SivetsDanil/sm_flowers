<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM Flowers — админка</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px/1.5 Arial;background:#f5f1eb;color:#20251f;margin:0}.wrap{max-width:1180px;margin:25px auto;padding:0 14px}.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 4px 18px #00000008}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #ddd5cb;border-radius:9px;font:inherit}button{padding:10px 14px;border:0;border-radius:9px;background:#263125;color:#fff;cursor:pointer}.secondary{background:#eee9e1;color:#222}.danger{background:#a83d35}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button.active{background:#263125;color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{border-top:1px solid #eee;padding:15px 0}.thumb{width:150px;height:110px;object-fit:cover;border-radius:10px;background:#eee}.site-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.site-tile{min-height:100px;padding:18px;border:1px solid #ded7ce;border-radius:16px;background:#fff;text-align:left;color:#20251f;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}.site-tile:hover{transform:translateY(-1px);border-color:#aaa196}.site-tile.active{background:#263125;color:#fff;border-color:#263125}.site-tile .icon{font-size:24px}.site-tile small{opacity:.65}.editor-panel{margin-top:18px;padding-top:20px;border-top:1px solid #e8e1d8}.editor-panel h3{margin:0 0 15px;font-family:Georgia,serif;font-size:28px;font-weight:400}.field{padding:14px 0;border-top:1px solid #eee}.field-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#687064}.photo{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}.photo img{width:190px;height:145px;object-fit:cover;border-radius:10px}.order{border-top:1px solid #eee;padding:17px 0}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee9e1}.savebar{position:sticky;bottom:10px;margin-top:18px;padding:12px;background:#fff;border:1px solid #e2dbd2;border-radius:12px}.notice{padding:10px;border-radius:9px;background:#f1ece5;margin:10px 0}@media(max-width:800px){.site-grid{grid-template-columns:1fr 1fr}.grid,.order-grid{grid-template-columns:1fr}}@media(max-width:520px){.site-grid{grid-template-columns:1fr}.site-tile{min-height:82px}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>SM Flowers — админка</h1><p class="muted">Вход администратора</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><p id="loginMsg"></p></section><section id="app" class="hidden"><header class="card"><div class="actions"><h1 style="margin-right:auto">SM Flowers — админка</h1><button id="logout" class="secondary">Выйти</button></div><div id="user" class="muted"></div><nav class="tabs"><button data-tab="products">Букеты</button><button data-tab="site">Редактор сайта</button><button data-tab="orders">Заказы</button><button data-tab="settings">Контакты студии</button></nav></header><section id="products" class="card panel"><h2>Букеты</h2><div class="grid"><div><div id="productsList"></div></div><div><form id="productForm"><input id="pid" type="hidden"><label>Название<input id="pname" required></label><label>Цена<input id="pprice" type="number" required></label><label>Описание<textarea id="pdesc"></textarea></label><label>Фото<input id="pfile" type="file" accept="image/*"></label><label><input id="pactive" type="checkbox" checked style="width:auto"> Показывать</label><button>Сохранить букет</button></form><p id="pmsg"></p></div></div></section><section id="site" class="card panel hidden"><h2>Редактор сайта</h2><p class="muted">Выбери отдельный блок. Ниже откроются только тексты и фотографии этого блока.</p><div id="siteGrid" class="site-grid"></div><div id="siteEditor" class="editor-panel hidden"></div></section><section id="orders" class="card panel hidden"><h2>Заказы</h2><div id="ordersList"></div></section><section id="settings" class="card panel hidden"><h2>Контакты студии</h2><div id="settingsList"></div></section></section></main><script>(()=>{const DB_URL='https://avlozhwwvjqiypifoxox.supabase.co',KEY='sb_publishable_3FgdTAmKB8kw2QTrrVPA5g_vb1lya1d',BUCKET='bouquets',db=supabase.createClient(DB_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),media=u=>{if(!u)return'';const v=String(u);if(v.startsWith('/media/'))return DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+v.slice(7);try{const x=new URL(v),n='/storage/v1/object/public/'+BUCKET+'/',i=x.pathname.indexOf(n);return i>=0?DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+x.pathname.slice(i+n.length):v}catch{return v}},upload=async(f,folder)=>{const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=folder+'/'+crypto.randomUUID()+'.'+ext,r=await db.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;return DB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+path},blocks=[['Главная','🏠'],['О студии','✨'],['Коллекции','🌸'],['На заказ','💐'],['Букеты','🌷'],['Философия','🤍'],['Жизнь студии','📸'],['Финальный блок','✨'],['Контакты','📍'],['Навигация','🧭']],activeBlock=null,sectionNames={};const labels={'Главная':'Главная','О студии':'О студии','Коллекции':'Выберите настроение (коллекции)','На заказ':'Ваша идея','Букеты':'Букеты недели','Философия':'Почему SM Flowers','Жизнь студии':'Жизнь студии','Финальный блок':'Финальный блок','Контакты':'Контакты','Навигация':'Навигация'};async function admin(){const s=await db.auth.getSession();if(s.error||!s.data.session?.user)throw new Error(s.error?.message||'Сессия не найдена');return s.data.session.user}async function show(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=u.email||'';loadProducts().catch(()=>{});loadOrders().catch(()=>{});loadSettings().catch(()=>{})}async function init(){try{const s=await db.auth.getSession();if(s.data.session)await show(await admin())}catch(e){$('loginMsg').textContent=e.message}}$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await show(r.data.user)}catch(e){$('loginMsg').textContent=e.message}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.remove('active');$(b.dataset.tab).classList.remove('hidden');b.classList.add('active');if(b.dataset.tab==='site')loadSite();if(b.dataset.tab==='orders')loadOrders();if(b.dataset.tab==='settings')loadSettings()});async function loadProducts(){const r=await db.from('products').select('*').order('sort_order').order('id');if(r.error)throw r.error;$('productsList').innerHTML=(r.data||[]).map(p=>`<div class="row"><div class="actions"><img class="thumb" src="${esc(media(p.image_url))}" alt=""><div><b>${esc(p.name)}</b><br>${Number(p.price||0).toLocaleString('ru-RU')} ₽<br><span class="muted">${esc(p.description||'')}</span><br><button data-edit="${p.id}">Изменить</button></div></div></div>`).join('')||'Нет букетов';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=r.data.find(x=>String(x.id)===b.dataset.edit);$('pid').value=p.id;$('pname').value=p.name;$('pprice').value=p.price;$('pdesc').value=p.description||'';$('pactive').checked=p.is_active!==false})}$('productForm').onsubmit=async e=>{e.preventDefault();try{const id=$('pid').value,f=$('pfile').files[0];let image=null;if(f)image=await upload(f,'products');else if(id){const q=await db.from('products').select('image_url').eq('id',id).single();if(q.error)throw q.error;image=q.data.image_url}const name=$('pname').value.trim(),payload={name,slug:name.toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'-'),price:Number($('pprice').value),description:$('pdesc').value.trim(),is_active:$('pactive').checked};if(image)payload.image_url=image;if(!id){const q=await db.from('products').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();payload.sort_order=Number(q.data?.sort_order||0)+1}const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;$('pmsg').textContent='Сохранено';$('productForm').reset();$('pid').value='';$('pactive').checked=true;loadProducts()}catch(e){$('pmsg').textContent=e.message}};async function loadSite(){const[t,m]=await Promise.all([db.from('site_content').select('*').order('sort_order').order('id'),db.from('site_media').select('*').order('sort_order').order('id')]);if(t.error)throw t.error;if(m.error)throw m.error;const present=[...new Set([...(t.data||[]).map(x=>x.section),...(m.data||[]).map(x=>x.section)])],sections=[...blocks.map(x=>x[0]).filter(x=>present.includes(x)),...present.filter(x=>!blocks.some(b=>b[0]===x))];$('siteGrid').innerHTML=sections.map(s=>{const icon=(blocks.find(b=>b[0]===s)||['','📦'])[1];return `<button class="site-tile ${activeBlock===s?'active':''}" data-block="${esc(s)}"><span class="icon">${icon}</span><strong>${esc(labels[s]||s)}</strong><small>${s===activeBlock?'Открыт':'Нажмите, чтобы открыть'}</small></button>`}).join('');document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>openBlock(b.dataset.block,t.data||[],m.data||[]));if(activeBlock)renderEditor(activeBlock,t.data||[],m.data||[])}function openBlock(s,t,m){activeBlock=s;loadSite()}function renderEditor(s,t,m){const box=$('siteEditor'),ts=t.filter(x=>x.section===s),ms=m.filter(x=>x.section===s);box.classList.remove('hidden');box.innerHTML=`<div class="actions"><h3>${esc(labels[s]||s)}</h3><button class="secondary" id="closeEditor">Закрыть</button></div><p class="muted">Все изменения сохраняются напрямую в Supabase и после обновления сайта становятся видны без нового редеплоя.</p><h4>Тексты</h4>${ts.length?ts.map(x=>`<div class="field"><div class="field-head"><b>${esc(x.label||x.content_key)}</b><span class="muted">${esc(x.content_key)}</span></div><textarea data-text="${x.id}" rows="4">${esc(x.content||'')}</textarea><label><input type="checkbox" data-vis="${x.id}" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><div><button data-tsave="${x.id}">Сохранить</button></div></div>`).join(''):'<p class="muted">Текстов пока нет.</p>'}<h4>Фотографии</h4>${ms.length?ms.map(x=>`<div class="field photo"><img src="${esc(media(x.image_url))}" alt="${esc(x.alt_text||'')}"><div style="flex:1;min-width:260px"><b>${esc(x.label||x.slot_key)}</b><input data-alt="${x.id}" value="${esc(x.alt_text||'')}" placeholder="Alt-текст"><input type="file" accept="image/*" data-file="${x.id}"><label><input type="checkbox" data-mvis="${x.id}" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><br><button data-msave="${x.id}">Сохранить фото</button></div></div>`).join(''):'<p class="muted">Фотографий пока нет.</p>'}<div class="field"><b>Добавить фотографию</b><input id="newPhotoLabel" placeholder="Название фотографии"><input id="newPhotoFile" type="file" accept="image/*"><button id="addPhoto">Добавить фото</button></div>`;document.querySelectorAll('[data-tsave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.tsave,r=await db.from('site_content').update({content:document.querySelector(`[data-text="${id}"]`).value,is_visible:document.querySelector(`[data-vis="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else b.textContent='Сохранено'});document.querySelectorAll('[data-msave]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.msave,f=document.querySelector(`[data-file="${id}"]`).files[0],patch={alt_text:document.querySelector(`[data-alt="${id}"]`).value,is_visible:document.querySelector(`[data-mvis="${id}"]`).checked,updated_at:new Date().toISOString()};if(f)patch.image_url=await upload(f,'site-media');const r=await db.from('site_media').update(patch).eq('id',id);if(r.error)throw r.error;b.textContent='Сохранено'}catch(e){alert(e.message)}});$('addPhoto').onclick=async()=>{try{const f=$('newPhotoFile').files[0];if(!f)return alert('Выберите фото');const q=await db.from('site_media').select('sort_order').eq('section',s).order('sort_order',{ascending:false}).limit(1).maybeSingle(),url=await upload(f,'site-media');const r=await db.from('site_media').insert({section:s,slot_key:'extra-'+crypto.randomUUID(),label:$('newPhotoLabel').value.trim()||'Новая фотография',image_url:url,sort_order:Number(q.data?.sort_order||0)+1,is_visible:true});if(r.error)throw r.error;await loadSite()}catch(e){alert(e.message)}};$('closeEditor').onclick=()=>{activeBlock=null;$('siteEditor').classList.add('hidden');loadSite()}}async function loadOrders(){const r=await db.from('orders').select('id,status,total_amount,delivery_address,delivery_date,delivery_time,comment,created_at,customers(name,phone,email,telegram),order_items(product_name,quantity,price)').order('created_at',{ascending:false});if(r.error)throw r.error;$('ordersList').innerHTML=(r.data||[]).map(o=>`<article class="order"><div class="actions"><b>Заказ #${o.id}</b><span class="status">${esc(o.status||'new')}</span><b>${Number(o.total_amount||0).toLocaleString('ru-RU')} ₽</b></div><div class="order-grid"><div><b>Клиент</b><br>${esc(o.customers?.name||'—')}<br>${esc(o.customers?.phone||'')}<br>${esc(o.customers?.email||'')}<br>💬 Telegram: ${esc(o.customers?.telegram||'—')}</div><div><b>Доставка</b><br>${esc(o.delivery_address||'—')}<br>${esc(o.delivery_date||'')} ${esc(o.delivery_time||'')}</div><div><b>Состав</b><br>${(o.order_items||[]).map(i=>`${esc(i.product_name||'')} × ${esc(i.quantity||1)} — ${Number(i.price||0).toLocaleString('ru-RU')} ₽`).join('<br>')||'—'}</div><div><b>Создан</b><br>${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):''}</div></div>${o.comment?`<div class="notice"><b>Комментарий:</b><br>${esc(o.comment)}</div>`:''}</article>`).join('')||'Заказов пока нет'}async function loadSettings(){const[s,c]=await Promise.all([db.from('store_settings').select('*').limit(1).maybeSingle(),db.from('site_content').select('*').eq('section','Контакты').order('sort_order').order('id')]);if(s.error)throw s.error;const d=s.data||{},rows=c.data||[];$('settingsList').innerHTML=`<h3>Основные контакты</h3><div class="grid"><label>Название<input data-s="store_name" value="${esc(d.store_name||'')}"></label><label>Телефон<input data-s="phone" value="${esc(d.phone||'')}"></label><label>Telegram<input data-s="telegram_url" value="${esc(d.telegram_url||'')}"></label><label>Instagram<input data-s="instagram_url" value="${esc(d.instagram_url||'')}"></label></div><button id="saveStore">Сохранить контакты</button><h3 style="margin-top:28px">Адрес, маршрут и график</h3>${rows.filter(x=>['studio_address','studio_map_label','studio_map_url','studio_hours_label','studio_hours'].includes(x.content_key)).map(x=>`<div class="field"><b>${esc(x.label||x.content_key)}</b><textarea data-c="${x.id}" rows="2">${esc(x.content||'')}</textarea><label><input type="checkbox" data-cv="${x.id}" ${x.is_visible!==false?'checked':''} style="width:auto"> Показывать</label><button data-csave="${x.id}">Сохранить</button></div>`).join('')}`;$('saveStore').onclick=async()=>{const patch={};document.querySelectorAll('[data-s]').forEach(i=>patch[i.dataset.s]=i.value);const r=await db.from('store_settings').update(patch).eq('id',d.id);alert(r.error?r.error.message:'Контакты сохранены')};document.querySelectorAll('[data-csave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.csave,r=await db.from('site_content').update({content:document.querySelector(`[data-c="${id}"]`).value,is_visible:document.querySelector(`[data-cv="${id}"]`).checked,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else b.textContent='Сохранено'})}init()})();</script><script src="./admin-collections.js?v=20260828"></script></body></html>
